
name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem, proposed solution, and expected business benefit.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current problem or limitation.
      placeholder: What problem are you experiencing, and who is affected?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide supporting evidence for the request.
      placeholder: Add screenshots, recordings, examples, or related issue links.
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Explain how the feature or improvement should work.
      placeholder: Describe your suggested solution and expected behavior.
    validations:
      required: true

  - type: textarea
    id: business_benefit
    attributes:
      label: Business Benefit
      description: Explain how this change benefits users or the business.
      placeholder: Explain the impact on efficiency, usability, revenue, or customer satisfaction.
    validations:
      required: false
