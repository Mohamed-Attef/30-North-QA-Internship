
name: Bug Report
description: Report a reproducible software defect
title: "[BUG]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Complete the fields below to document the defect clearly.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Briefly describe the issue.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Test Environment
      description: App version, device, branch, and other relevant details.
      placeholder: "e.g., Waiter App, Tablet"
    validations:
      required: false


  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps in the exact order needed to reproduce the issue.
      placeholder: |
        1. 
        2. 
        3.
        4. 
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, screen recordings, logs, or relevant links.
      placeholder: "Attach evidence or paste a link."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Include related issues, frequency, or other observations.
    validations:
      required: false
